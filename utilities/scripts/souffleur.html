<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Souffleur</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.3.0/index.min.css"/>
<style>
:root {
  color-scheme: dark;
}
* {
  font-family: "JetBrains Mono Variable", ui-monospace, monospace;
}
#preview {
  width: 10vmin;
}
</style>
</head>
<body>
<video id="preview" playsinline muted></video>
<select id="cameras"></select>
<button id="capture">Capture</button>
<button id="record">Start</button>
<div id="status">Idle</div>
<script>

const AUDIO_SAMPLING_RATE = 16000;

const statusField = document.getElementById("status");
const recordButton = document.getElementById("record");
const cameraSelect = document.getElementById("cameras");
const captureButton = document.getElementById("capture");
const previewVideo = document.getElementById("preview");

let audioContext = null;
let audioStream = null;
let sourceNode = null;
let workletNode = null;
let muteNode = null;
let socket = null;
let cameraStream = null;

const WORKLET_CODE = `
class AudioProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const samples = inputs[0]?.[0];
    if (samples) {
      const block = new Float32Array(samples);
      this.port.postMessage(block, [block.buffer]);
    }
    return true;
  }
}
registerProcessor('audio-processor', AudioProcessor);
`;

async function start() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusField.textContent = window.isSecureContext ? "Microphone inaccessible" : "Microphone requires HTTPS";
    recordButton.hidden = false;
    return;
  }
  statusField.textContent = "Microphone starting...";
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: AUDIO_SAMPLING_RATE,
        echoCancellation: true,
        noiseSuppression: true,
      },
    });
  } catch (error) {
    statusField.textContent = `Microphone unavailable due to ${error.message}`;
    recordButton.hidden = false;
    return;
  }
  await audioContext.resume();
  const url = URL.createObjectURL(new Blob([WORKLET_CODE], { type: "application/javascript" }));
  try {
    await audioContext.audioWorklet.addModule(url);
  } finally {
    URL.revokeObjectURL(url);
  }
  socket = new WebSocket(`wss://${location.host}/audio`);
  sourceNode = audioContext.createMediaStreamSource(audioStream);
  workletNode = new AudioWorkletNode(audioContext, "audio-processor");
  workletNode.port.onmessage = (event) => {
    if (socket.readyState === WebSocket.OPEN) socket.send(event.data.buffer);
  };
  sourceNode.connect(workletNode);
  muteNode = audioContext.createGain();
  muteNode.gain.value = 0;
  workletNode.connect(muteNode).connect(audioContext.destination);
  statusField.textContent = `Microphone capturing at ${audioContext.sampleRate} Hz, mono.`;
}

async function listCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cameras = devices.filter((device) => device.kind === "videoinput");
  cameraSelect.replaceChildren(...cameras.map((camera, index) => {
    const option = document.createElement("option");
    option.value = camera.deviceId;
    option.textContent = camera.label || `Camera ${index + 1}`;
    return option;
  }));
  cameraSelect.value = cameras[0]?.deviceId ?? "";
}

async function startCamera() {
  if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: cameraSelect.value ? { deviceId: { exact: cameraSelect.value } } : true,
  });
  previewVideo.srcObject = cameraStream;
  await previewVideo.play();
}

async function capture(upload) {
  if (!cameraStream) await startCamera();
  const canvas = document.createElement("canvas");
  canvas.width = previewVideo.videoWidth;
  canvas.height = previewVideo.videoHeight;
  canvas.getContext("2d").drawImage(previewVideo, 0, 0);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
  if (!upload) return;
  const response = await fetch("/screenshot", { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } });
  statusField.textContent = response.ok
    ? `Captured ${canvas.width}x${canvas.height}, ${blob.size} bytes uploaded.`
    : `Upload failed with status ${response.status}`;
}

cameraSelect.onchange = () => startCamera();

captureButton.onclick = async () => {
  captureButton.disabled = true;
  try {
    await capture(true);
  } catch (error) {
    statusField.textContent = `Capture failed due to ${error.message}`;
  } finally {
    captureButton.disabled = false;
  }
};

listCameras();

recordButton.onclick = async () => {
  recordButton.hidden = true;
  if (!audioContext) audioContext = new AudioContext({ sampleRate: AUDIO_SAMPLING_RATE });
  await start();
  try {
    await capture(false);
    await listCameras();
  } catch (error) {
    statusField.textContent = `Camera unavailable due to ${error.message}`;
  }
};

</script>
</body>
</html>
