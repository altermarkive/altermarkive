---
name: Souffleur CodeQL config
# js/clear-text-storage-of-sensitive-data fires on settings.ts writing the
# Anthropic API key to LocalStorage. That is deliberate: the app is served as a
# static site from GitHub Pages with no backend to hold the key, and it calls
# the Anthropic API directly with `dangerouslyAllowBrowser`. Encrypting the key
# client-side would only move the problem, since the page would still need the
# plaintext to sign requests.
query-filters:
  - exclude:
      id: js/clear-text-storage-of-sensitive-data
