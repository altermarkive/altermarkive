---
name: souffleur
on:
  push:
jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refactor/souffleur
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - name: Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: refactor/souffleur/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # `build` runs type-check and build-only in parallel via run-p.
      - name: Build
        run: pnpm build
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Tags
        id: tags
        run: |
          DOCKER_IMAGE='ghcr.io/${{ github.repository_owner }}/souffleur'
          TAGS="${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:$(date +%Y%m%d%H%M%S)"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: QEMU
        uses: docker/setup-qemu-action@v4.2.0
      - name: Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
          registry: ghcr.io
      - name: Build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
      - name: Trash
        uses: actions/delete-package-versions@v5
        with:
          min-versions-to-keep: 20
          package-name: souffleur
          package-type: container
