---
name: souffleur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refactor/souffleur
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - name: Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: refactor/souffleur/pnpm-lock.yaml
      - name: Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: refactor/souffleur/dist
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v5.0.0
