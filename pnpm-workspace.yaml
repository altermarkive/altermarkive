# Supply-chain hardening, per https://pnpm.io/supply-chain-security

# Wait a week after a version is published before it may be resolved, so a
# compromised release has time to be caught. pnpm 11 also checks this against
# the committed lockfile, not just at resolution time.
minimumReleaseAge: 10080

# Refuse transitive deps served from git repos or tarball URLs.
blockExoticSubdeps: true

# Refuse a package whose signature/provenance is weaker than what was locked.
trustPolicy: no-downgrade

# pnpm 11 makes an unapproved install script a hard error. Nothing here needs
# one: all four are Node-side dependencies of @huggingface/transformers that a
# browser build never loads (onnxruntime-node is the server twin of the
# onnxruntime-web we ship). Denying them explicitly states the decision.
allowBuilds:
  '@parcel/watcher': false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
